name: build-test-demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Java tests and packages
        run: mvn -B verify
      - name: Go formatting, vet and tests
        run: |
          test -z "$(find libs/platform services -name '*.go' -print0 | xargs -0 gofmt -l)"
          go vet ./...
          go test -race -tags=integration -coverprofile=coverage.out ./...
          go build ./...
      - name: Run full stack
        run: |
          python3 scripts/init_env.py
          docker compose up --build -d --wait --wait-timeout 600
      - name: End-to-end acceptance
        run: python3 tests/acceptance.py
      - name: Logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            compose.log
            coverage.out
            **/target/surefire-reports/*
      - name: Stop services
        if: always()
        run: docker compose down -v
