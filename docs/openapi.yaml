components:
  schemas:
    ProductInput:
      type: object
      properties:
        sku: *id002
        name: *id002
        description: *id002
        category: *id002
        barcode: *id002
        weight: &id003
          type: number
          exclusiveMinimum: true
          minimum: 0
        length: *id003
        width: *id003
        height: *id003
        storageType: &id004
          type: string
          enum:
          - NORMAL
          - FRAGILE
          - COLD
          - HAZARDOUS
          - OVERSIZED
      required:
      - sku
      - name
      - weight
      - length
      - width
      - height
      - storageType
    WarehouseInput:
      type: object
      properties:
        code: *id002
        name: *id002
        address: *id002
      required:
      - code
      - name
      - address
    ZoneInput:
      type: object
      properties:
        code: *id002
        name: *id002
        type:
          type: string
          enum:
          - RECEIVING
          - STORAGE
          - PICKING
          - PACKING
          - SHIPPING
          - QUARANTINE
      required:
      - code
      - name
      - type
    RackInput:
      type: object
      properties:
        code: *id002
      required:
      - code
    LocationInput:
      type: object
      properties:
        code: *id002
        maxWeight: *id003
        maxVolume: *id003
        distance:
          type: number
          minimum: 0
        storageType: *id004
      required:
      - code
      - maxWeight
      - maxVolume
      - distance
      - storageType
    StatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - BLOCKED
          - MAINTENANCE
      required:
      - status
    ReceiveInput:
      type: object
      properties:
        productId: *id001
        warehouseId: *id001
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        batchNumber: *id002
        expirationDate:
          type: string
          format: date
      required:
      - productId
      - warehouseId
      - quantity
      - batchNumber
    MoveInput:
      type: object
      properties:
        stockId: *id001
        toLocationId: *id001
        quantity: &id005
          type: integer
          format: int64
          minimum: 1
      required:
      - stockId
      - toLocationId
      - quantity
    WriteOffInput:
      type: object
      properties:
        stockId: *id001
        quantity: *id005
        reason:
          type: string
          minLength: 1
      required:
      - stockId
      - quantity
      - reason
    AdjustInput:
      type: object
      properties:
        stockId: *id001
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        reason:
          type: string
          minLength: 1
      required:
      - stockId
      - quantity
      - reason
    Line:
      type: object
      properties:
        productId: *id001
        quantity: *id005
      required:
      - productId
      - quantity
    ReservationInput:
      type: object
      properties:
        warehouseId: *id001
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Line'
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 1800
          default: 1800
      required:
      - warehouseId
      - items
    ShipmentInput:
      type: object
      properties:
        reservationId: *id001
      required:
      - reservationId
    Error:
      type: object
      properties:
        code: *id002
        message: *id002
        details:
          type: object
        timestamp:
          type: string
          format: date-time
        traceId: *id002
      required:
      - code
      - message
      - details
      - timestamp
      - traceId
    Envelope:
      type: object
      properties:
        data:
          description: Resource, command result, or list; see operation description.
        timestamp:
          type: string
          format: date-time
      required:
      - data
      - timestamp
