openapi: 3.0.3
info:
  title: LogiCore WMS API
  version: 1.0.0
  description: Local warehouse backend. Mutations require Idempotency-Key; workflow
    completion is asynchronous.
paths:
  /warehouses:
    post:
      tags:
      - warehouse
      summary: Create warehouse
      description: Create warehouse
      operationId: warehouse_post__warehouses
      servers:
      - url: http://localhost:8081
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Unique per service. Reuse only for the identical request.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Business conflict or idempotency mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
    get:
      tags:
      - warehouse
      summary: Read warehouse structure
      description: Collection endpoints return up to 500 records. Location occupancy
        is an eventually consistent projection.
      operationId: warehouse_get__warehouses
      servers:
      - url: http://localhost:8081
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Invalid request
